[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "processiq-core"
version = "0.1.0"
description = "Motor de análise de planilhas de contas a pagar: duplicidades, vencidos e valores suspeitos"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alan Tustoni" }]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
processiq = "processiq_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
