[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "processiq-core"
version = "0.1.0"
description = "Motor de análise de planilhas de contas a pagar: duplicidades, vencidos e valores suspeitos"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alan Tustoni" }]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.115", "python-multipart>=0.0.9"]

[project.scripts]
processiq = "processiq_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
